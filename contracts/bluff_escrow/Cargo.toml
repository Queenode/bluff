[package]
name = "bluff_escrow"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/Rampop01/bluff"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
hex = "0.4.3"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
